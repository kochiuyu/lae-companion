<!-- Click-to-enlarge for .wdiag, Mermaid, and Quarto structural figures.
     Desktop + mobile: wrap hosts in .fig-enlarge-wrap (stable click target).
     Lightbox zoom: +/− / wheel / pinch grow real layout size (crisp SVG). Mermaid clone keeps markers/fill.
     Never inject nodes inside pre.mermaid source. -->
<dialog id="fig-lightbox" class="fig-lightbox" aria-labelledby="fig-lightbox-title">
  <div class="fig-lightbox-chrome">
    <p id="fig-lightbox-title" class="fig-lightbox-title"></p>
    <div class="fig-lightbox-zoom" role="group" aria-label="Zoom">
      <button type="button" class="fig-lightbox-zoom-out" aria-label="Zoom out">−</button>
      <button type="button" class="fig-lightbox-zoom-reset" aria-label="Reset zoom">100%</button>
      <button type="button" class="fig-lightbox-zoom-in" aria-label="Zoom in">+</button>
    </div>
    <button type="button" class="fig-lightbox-close" aria-label="Close enlarged figure">&times;</button>
  </div>
  <div class="fig-lightbox-stage" tabindex="0">
    <div class="fig-lightbox-viewport"></div>
  </div>
  <p class="fig-lightbox-hint">Use + / −, scroll wheel, or pinch to zoom · scrollbars to pan · Esc or × to close</p>
</dialog>
<script>
(function () {
  var dialog = document.getElementById("fig-lightbox");
  if (!dialog || typeof dialog.showModal !== "function") return;
  var stage = dialog.querySelector(".fig-lightbox-stage");
  var viewport = dialog.querySelector(".fig-lightbox-viewport");
  var titleEl = document.getElementById("fig-lightbox-title");
  var closeBtn = dialog.querySelector(".fig-lightbox-close");
  var zoomInBtn = dialog.querySelector(".fig-lightbox-zoom-in");
  var zoomOutBtn = dialog.querySelector(".fig-lightbox-zoom-out");
  var zoomResetBtn = dialog.querySelector(".fig-lightbox-zoom-reset");

  var ZOOM_MIN = 0.5;
  var ZOOM_MAX = 6;
  var ZOOM_STEP = 1.25;
  var zoom = 1;
  var pinchStartDist = 0;
  var pinchStartZoom = 1;
  /* Layout size at 100% (CSS px). Zoom grows real width/height so SVG re-rasters crisp. */
  var baseW = 0;
  var baseH = 0;
  var baseFontRem = 1.05;

  function contentEl() {
    return viewport.firstElementChild;
  }

  function clearSizedStyles(el) {
    if (!el || !el.style) return;
    el.style.removeProperty("width");
    el.style.removeProperty("height");
    el.style.removeProperty("max-width");
    el.style.removeProperty("max-height");
    el.style.removeProperty("font-size");
    el.classList.remove("fig-lightbox-sized");
  }

  function captureBaseSize() {
    var el = contentEl();
    baseW = 0;
    baseH = 0;
    if (!el) return;
    clearSizedStyles(el);
    viewport.removeAttribute("data-zooming");
    void el.offsetWidth;
    var r = el.getBoundingClientRect();
    baseW = r.width;
    baseH = r.height;
    if (el.tagName === "IMG" && el.naturalWidth) {
      el.dataset.naturalW = String(el.naturalWidth);
    }
  }

  function applyZoomLayout() {
    var el = contentEl();
    /* Drop CSS-transform zoom (blurs vectors painted at page size). */
    viewport.style.transform = "";
    viewport.style.marginRight = "";
    viewport.style.marginBottom = "";
    if (!el || baseW <= 0) return;

    if (Math.abs(zoom - 1) < 0.001) {
      clearSizedStyles(el);
      viewport.removeAttribute("data-zooming");
      return;
    }

    viewport.setAttribute("data-zooming", "1");
    el.classList.add("fig-lightbox-sized");
    var w = baseW * zoom;
    var h = baseH * zoom;

    if (el.tagName === "SVG") {
      el.style.setProperty("max-width", "none", "important");
      el.style.setProperty("max-height", "none", "important");
      el.style.setProperty("width", w + "px", "important");
      el.style.setProperty("height", h + "px", "important");
    } else if (el.tagName === "IMG") {
      el.style.setProperty("max-width", "none", "important");
      el.style.setProperty("width", w + "px", "important");
      el.style.setProperty("height", "auto", "important");
    } else {
      el.style.setProperty("max-width", "none", "important");
      el.style.setProperty("width", w + "px", "important");
      if (el.classList.contains("fig-lightbox-wdiag") || el.classList.contains("wdiag") ||
          (el.querySelector && el.querySelector(".wdiag"))) {
        el.style.fontSize = (baseFontRem * zoom) + "rem";
      }
      var img = el.querySelector && el.querySelector("img");
      if (img) {
        img.style.setProperty("max-width", "none", "important");
        img.style.setProperty("width", "100%", "important");
        img.style.height = "auto";
      }
    }
  }

  function setZoom(next, originX, originY) {
    var z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
    if (typeof originX === "number" && typeof originY === "number" && zoom > 0) {
      var rect = stage.getBoundingClientRect();
      var sx = stage.scrollLeft + (originX - rect.left);
      var sy = stage.scrollTop + (originY - rect.top);
      var ratio = z / zoom;
      zoom = z;
      applyZoomLayout();
      stage.scrollLeft = sx * ratio - (originX - rect.left);
      stage.scrollTop = sy * ratio - (originY - rect.top);
    } else {
      zoom = z;
      applyZoomLayout();
    }
    zoomResetBtn.textContent = Math.round(zoom * 100) + "%";
    zoomOutBtn.disabled = zoom <= ZOOM_MIN + 0.001;
    zoomInBtn.disabled = zoom >= ZOOM_MAX - 0.001;
  }

  function resetZoom() {
    zoom = 1;
    viewport.style.transform = "";
    viewport.style.marginRight = "";
    viewport.style.marginBottom = "";
    clearSizedStyles(contentEl());
    viewport.removeAttribute("data-zooming");
    stage.scrollLeft = 0;
    stage.scrollTop = 0;
    zoomResetBtn.textContent = "100%";
    zoomOutBtn.disabled = false;
    zoomInBtn.disabled = false;
  }

  function isMermaidHost(el) {
    if (!el || !el.tagName) return false;
    if (el.tagName === "SVG") {
      var c = el.getAttribute("class") || "";
      return /\bmermaid-js\b/.test(c) || /^mermaid-/.test(el.id || "") || /\bflowchart\b/.test(c);
    }
    return el.classList.contains("mermaid") ||
      (el.tagName === "PRE" && el.classList.contains("mermaid-js"));
  }

  function findSvg(from) {
    if (!from) return null;
    if (from.tagName === "SVG") return from;
    if (from.querySelector) {
      var inner = from.querySelector("svg.mermaid-js, svg[id^='mermaid'], svg.flowchart, svg");
      if (inner) return inner;
    }
    var scope = from.closest ? from.closest("figure, .figure, .cell, .quarto-figure, .quarto-diagram, .fig-enlarge-wrap") : null;
    if (!scope && from.parentElement) scope = from.parentElement;
    if (scope) {
      var s = scope.querySelector("svg.mermaid-js, svg[id^='mermaid'], svg.flowchart, svg");
      if (s) return s;
    }
    var n = from.nextElementSibling;
    while (n) {
      if (n.tagName === "SVG") return n;
      if (n.querySelector) {
        var s2 = n.querySelector("svg");
        if (s2) return s2;
      }
      n = n.nextElementSibling;
    }
    return null;
  }

  function captionFor(host) {
    if (!host) return "Enlarged figure";
    var cap =
      (host.querySelector && host.querySelector(".wdiag-cap, figcaption, .figure-caption, .quarto-figure-caption")) ||
      (host.getAttribute && host.getAttribute("aria-labelledby")
        ? document.getElementById(host.getAttribute("aria-labelledby"))
        : null);
    if (cap) return cap.textContent.trim();
    var svg = findSvg(host);
    if (svg && svg.getAttribute("aria-roledescription")) return "Diagram";
    if (host.getAttribute && host.getAttribute("aria-label")) {
      return host.getAttribute("aria-label").replace(/^View larger:\s*/i, "");
    }
    if (isMermaidHost(host) || (host.tagName === "SVG")) return "Diagram";
    return "Enlarged figure";
  }

  function cloneMermaidSvg(svg) {
    var box = document.createElement("div");
    box.innerHTML = svg.outerHTML;
    var svgClone = box.querySelector("svg") || svg.cloneNode(true);

    var oldId = svg.getAttribute("id") || "";
    var newId = oldId ? ("lb-" + oldId) : ("lb-mermaid-" + Date.now().toString(36));

    function rewrite(str) {
      if (!str || str.indexOf(oldId) === -1) return str;
      var esc = oldId.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return str
        .replace(new RegExp("#" + esc + "(?=\\b|_)", "g"), "#" + newId)
        .replace(new RegExp(esc + "_", "g"), newId + "_")
        .replace(new RegExp(esc + "-", "g"), newId + "-")
        .replace(new RegExp("(^|[^\\w-])" + esc + "(?=[^\\w-]|$)", "g"), "$1" + newId);
    }

    if (oldId) {
      svgClone.querySelectorAll("style").forEach(function (st) {
        st.textContent = rewrite(st.textContent || "");
      });
      svgClone.querySelectorAll("[id]").forEach(function (node) {
        if (node === svgClone) return;
        var id = node.getAttribute("id");
        if (!id) return;
        if (id === oldId || id.indexOf(oldId + "_") === 0 || id.indexOf(oldId + "-") === 0) {
          node.setAttribute("id", rewrite(id));
        }
      });
      svgClone.setAttribute("id", newId);
      var attrs = [
        "marker-end", "marker-start", "marker-mid",
        "clip-path", "fill", "stroke", "filter",
        "href", "xlink:href", "style"
      ];
      svgClone.querySelectorAll("*").forEach(function (node) {
        attrs.forEach(function (a) {
          var v = node.getAttribute(a);
          if (v && v.indexOf(oldId) !== -1) node.setAttribute(a, rewrite(v));
        });
      });
      var rs = svgClone.getAttribute("style");
      if (rs) svgClone.setAttribute("style", rewrite(rs));
    } else {
      svgClone.setAttribute("id", newId);
    }

    var edgeSel = [
      "path.flowchart-link", ".edgePath path",
      "path[marker-end]", "path[marker-start]",
      ".edge-thickness-normal", ".edge-pattern-solid", ".edge-pattern-dotted"
    ].join(",");
    svgClone.querySelectorAll(edgeSel).forEach(function (p) {
      p.setAttribute("fill", "none");
    });
    var guard = document.createElementNS("http://www.w3.org/2000/svg", "style");
    guard.textContent = [
      "#" + newId + " path.flowchart-link,",
      "#" + newId + " .edgePath path,",
      "#" + newId + " path[marker-end],",
      "#" + newId + " path[marker-start]",
      "{fill:none!important;}",
      "#" + newId + " .flowchart-link{fill:none!important;}"
    ].join("");
    svgClone.insertBefore(guard, svgClone.firstChild);

    svgClone.classList.add("fig-lightbox-clone");
    svgClone.classList.add("fig-lightbox-svg");
    svgClone.setAttribute("preserveAspectRatio", "xMidYMid meet");
    if (svgClone.getAttribute("viewBox")) {
      svgClone.removeAttribute("width");
      svgClone.removeAttribute("height");
    }
    svgClone.style.width = "";
    svgClone.style.height = "";
    svgClone.style.maxWidth = "";
    svgClone.style.maxHeight = "";
    return svgClone;
  }

  function openFrom(host) {
    viewport.innerHTML = "";
    resetZoom();
    var svg = findSvg(host);
    if (svg || (host && host.tagName === "SVG") || isMermaidHost(host)) {
      svg = svg || (host.tagName === "SVG" ? host : null);
      if (svg) {
        viewport.appendChild(cloneMermaidSvg(svg));
      } else {
        var note = document.createElement("p");
        note.textContent = "Diagram is still loading — close and try again in a moment.";
        viewport.appendChild(note);
      }
    } else {
      var clone = host.cloneNode(true);
      clone.querySelectorAll(".fig-enlarge-hint").forEach(function (h) { h.remove(); });
      clone.classList.remove("fig-enlargeable");
      clone.classList.remove("fig-enlarge-wrap");
      clone.removeAttribute("id");
      clone.removeAttribute("data-enlarge-bound");
      clone.removeAttribute("tabindex");
      clone.removeAttribute("role");
      clone.classList.add("fig-lightbox-clone");
      if (clone.classList.contains("wdiag") || clone.querySelector(".wdiag")) {
        clone.classList.add("fig-lightbox-wdiag");
      }
      viewport.appendChild(clone);
    }
    titleEl.textContent = captionFor(host);
    dialog.showModal();
    stage.focus();
    /* Measure fit size after dialog layout; zoom then grows that box (vector re-paint). */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        captureBaseSize();
        if (Math.abs(zoom - 1) > 0.001) applyZoomLayout();
      });
    });
  }

  function close() {
    if (dialog.open) dialog.close();
    viewport.innerHTML = "";
    resetZoom();
  }

  closeBtn.addEventListener("click", close);
  dialog.addEventListener("click", function (e) {
    if (e.target === dialog) close();
  });
  dialog.addEventListener("cancel", function (e) {
    e.preventDefault();
    close();
  });

  zoomInBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    setZoom(zoom * ZOOM_STEP);
  });
  zoomOutBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    setZoom(zoom / ZOOM_STEP);
  });
  zoomResetBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    resetZoom();
  });

  stage.addEventListener("wheel", function (e) {
    if (!dialog.open) return;
    e.preventDefault();
    var factor = e.deltaY < 0 ? ZOOM_STEP : (1 / ZOOM_STEP);
    if (e.ctrlKey || e.metaKey) {
      factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
    }
    setZoom(zoom * factor, e.clientX, e.clientY);
  }, { passive: false });

  stage.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.sqrt(dx * dx + dy * dy) || 1;
      pinchStartZoom = zoom;
    }
  }, { passive: true });
  stage.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      setZoom(pinchStartZoom * (dist / pinchStartDist), midX, midY);
    }
  }, { passive: false });
  stage.addEventListener("touchend", function (e) {
    if (e.touches.length < 2) pinchStartDist = 0;
  }, { passive: true });

  dialog.addEventListener("keydown", function (e) {
    if (!dialog.open) return;
    if (e.key === "+" || e.key === "=") { e.preventDefault(); setZoom(zoom * ZOOM_STEP); }
    if (e.key === "-" || e.key === "_") { e.preventDefault(); setZoom(zoom / ZOOM_STEP); }
    if (e.key === "0") { e.preventDefault(); resetZoom(); }
  });

  function ensureWrap(el) {
    if (!el || !el.parentNode) return null;
    if (el.classList && el.classList.contains("fig-enlarge-wrap")) return el;
    var existing = el.closest && el.closest(".fig-enlarge-wrap");
    if (existing) return existing;
    if (el.matches && el.matches("figure.wdiag, figure.quarto-figure")) {
      el.classList.add("fig-enlarge-wrap");
      return el;
    }
    var wrap = document.createElement("div");
    wrap.className = "fig-enlarge-wrap";
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    return wrap;
  }

  function collectTargets() {
    var list = [];
    var seen = new Set();
    function add(el) {
      if (!el || seen.has(el)) return;
      seen.add(el);
      list.push(el);
    }
    document.querySelectorAll("figure.wdiag").forEach(add);
    document.querySelectorAll(".wdiag").forEach(function (el) {
      if (el.closest("figure.wdiag")) return;
      add(el);
    });
    document.querySelectorAll("svg.mermaid-js, svg[id^='mermaid']").forEach(add);
    document.querySelectorAll("pre.mermaid").forEach(add);
    document.querySelectorAll("figure.quarto-figure, .quarto-figure").forEach(function (el) {
      if (el.closest("figure.wdiag") || el.querySelector("svg.mermaid-js, pre.mermaid")) return;
      add(el);
    });
    return list;
  }

  function sweepOrphanHints() {
    document.querySelectorAll(".fig-enlarge-hint").forEach(function (h) {
      if (h.closest(".fig-enlarge-wrap, .fig-enlargeable, figure.wdiag, .wdiag")) return;
      var prev = h.previousElementSibling;
      var next = h.nextElementSibling;
      if (prev && (isMermaidHost(prev) || (prev.matches && prev.matches("svg, figure, .wdiag, .fig-enlarge-wrap")))) return;
      if (next && (isMermaidHost(next) || (next.matches && next.matches("svg, figure, .wdiag, .fig-enlarge-wrap")))) return;
      h.remove();
    });
  }

  function bind(el) {
    var wrap = ensureWrap(el);
    if (!wrap) return;

    if (wrap.dataset.enlargeBound === "1") {
      wrap.classList.add("fig-enlarge-wrap");
      wrap.classList.add("fig-enlargeable");
      if (wrap.querySelector(":scope > .fig-enlarge-hint")) return;
    }

    wrap.dataset.enlargeBound = "1";
    wrap.classList.add("fig-enlarge-wrap");
    wrap.classList.add("fig-enlargeable");
    if (!wrap.hasAttribute("tabindex")) wrap.setAttribute("tabindex", "0");
    wrap.setAttribute("role", "button");
    wrap.setAttribute("aria-label", "View larger: " + captionFor(wrap));

    var hint = wrap.querySelector(":scope > .fig-enlarge-hint");
    if (!hint) {
      hint = document.createElement("button");
      hint.type = "button";
      hint.className = "fig-enlarge-hint";
      hint.textContent = "Click to view larger";
      wrap.appendChild(hint);
    }
    hint.onclick = function (e) {
      e.preventDefault();
      e.stopPropagation();
      openFrom(wrap);
    };

    if (!wrap._figEnlargeWired) {
      wrap._figEnlargeWired = true;
      wrap.addEventListener("click", function (e) {
        if (e.target.closest("a")) return;
        if (e.target.closest("button.fig-enlarge-hint")) return;
        e.preventDefault();
        openFrom(wrap);
      });
      wrap.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openFrom(wrap);
        }
      });
    }
  }

  function run() {
    sweepOrphanHints();
    collectTargets().forEach(bind);
  }

  function start() {
    run();
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      run();
      if (tries >= 20) clearInterval(timer);
    }, 400);
    if (window.MutationObserver) {
      var mo = new MutationObserver(function () { run(); });
      mo.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { mo.disconnect(); }, 15000);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
