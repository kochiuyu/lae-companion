<!-- Mobile "On this page": Quarto hides the right TOC below ~768px.
     Clone #TOC into a collapsed <details> at the top of main content. -->
<script>
(function () {
  function placeMobileToc() {
    if (window.matchMedia("(min-width: 768px)").matches) return;
    var main = document.getElementById("quarto-document-content");
    var src = document.getElementById("TOC");
    if (!main || !src) return;
    if (document.getElementById("mobile-on-this-page")) return;
    var list = src.querySelector("ul");
    if (!list) return;
    var details = document.createElement("details");
    details.id = "mobile-on-this-page";
    details.className = "mobile-toc";
    var summary = document.createElement("summary");
    summary.textContent = "On this page";
    details.appendChild(summary);
    var clone = list.cloneNode(true);
    clone.removeAttribute("id");
    details.appendChild(clone);
    details.addEventListener("click", function (e) {
      var a = e.target.closest("a");
      if (a && details.open) details.open = false;
    });
    var titleBlock = main.querySelector(".quarto-title, header, h1");
    if (titleBlock && titleBlock.parentElement === main) {
      titleBlock.insertAdjacentElement("afterend", details);
    } else {
      main.insertBefore(details, main.firstChild);
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", placeMobileToc);
  } else {
    placeMobileToc();
  }
})();
</script>
